[project]
name = "research-vis-lib"
version = "0.2.0"
description = "Pick a scientific chart template for experimental data and generate the plotting code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0.1"]

[project.scripts]
research-vis-lib = "rvl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rvl"]
